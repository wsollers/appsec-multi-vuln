name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: microsoft/setup-msbuild@v2
        if: runner.os == 'Windows'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x scripts/*.sh projects/bash/case-019/run.sh
          ./scripts/build.sh
          ./scripts/smoke.sh
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/smoke.ps1
