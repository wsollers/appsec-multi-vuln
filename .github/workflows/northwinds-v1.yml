name: northwinds-v1

# Scoped to the secure Northwind reference app only; does not affect other cases.
on:
  push:
    paths:
      - 'projects/northwinds-v1/**'
      - '.github/workflows/northwinds-v1.yml'
  pull_request:
    paths:
      - 'projects/northwinds-v1/**'
      - '.github/workflows/northwinds-v1.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/northwinds-v1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/northwinds-v1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
