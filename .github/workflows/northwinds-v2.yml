name: northwinds-v2

# Scoped to the Northwind app only; does not affect other cases.
on:
  push:
    paths:
      - 'projects/northwinds-v2/**'
      - '.github/workflows/northwinds-v2.yml'
  pull_request:
    paths:
      - 'projects/northwinds-v2/**'
      - '.github/workflows/northwinds-v2.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/northwinds-v2

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: projects/northwinds-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
